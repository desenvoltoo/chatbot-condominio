version: '3.8'

services:
  evolution-api:
    image: atendai/evolution-api:v2.2.0
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=4296086847242404
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres_pass@postgres:5432/evolution?schema=public
      - DATABASE_CLIENT_NAME=evolution_exchange
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379
      - LOG_LEVEL=ERROR,WARN,INFO
      - DEL_INSTANCE=false
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_pass
      - POSTGRES_DB=evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - evolution_redisdata:/data

volumes:
  evolution_pgdata:
  evolution_redisdata:
